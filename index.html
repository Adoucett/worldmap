<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" href="data:,"> <title>Planet Map Creator</title>
  <style>
    :root {
      --c-accent: #009DA5;
      --c-accent-hover: #007d84;
      --c-bg: #f8f9fa;
      --c-panel: #ffffff;
      --c-text: #333333;
      --c-border: #e0e0e0;
    }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--c-bg); color: var(--c-text); overflow: hidden; }
    
    /* Layout */
    .grid { display: grid; grid-template-columns: 300px 1fr 300px; width: 100vw; height: 100vh; }
    aside { background: var(--c-panel); border-right: 1px solid var(--c-border); display: flex; flex-direction: column; z-index: 10; overflow: hidden; }
    aside.right { border-right: none; border-left: 1px solid var(--c-border); }
    
    /* Scrollable areas */
    .scroll-y { overflow-y: auto; padding: 1.25rem; display: flex; flex-direction: column; gap: 1.25rem; flex: 1; }
    
    /* Map Area */
    main { position: relative; background: #e0e0e0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    svg { display: block; width: 100%; height: 100%; cursor: grab; }
    svg:active { cursor: grabbing; }

    /* Controls */
    h3 { margin: 0 0 0.5rem 0; font-size: 0.85rem; text-transform: uppercase; color: var(--c-accent); border-bottom: 2px solid var(--c-accent); padding-bottom: 0.25rem; letter-spacing: 0.5px; }
    label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.85rem; font-weight: 500; }
    input, select, button { padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; background: #fff; width: 100%; box-sizing: border-box; }
    input:focus, select:focus { border-color: var(--c-accent); outline: none; }
    
    /* Range Inputs */
    .range-row { display: flex; align-items: center; gap: 0.5rem; }
    input[type="range"] { flex: 1; padding: 0; }
    .val-display { font-size: 0.8rem; color: #666; width: 3.5ch; text-align: right; }

    /* Color Inputs */
    .color-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    input[type="color"] { padding: 0; height: 32px; cursor: pointer; }

    /* Buttons */
    button { background: var(--c-accent); color: white; border: none; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: var(--c-accent-hover); }
    button.secondary { background: #6c757d; }
    button.secondary:hover { background: #5a6268; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* List & Tags */
    .search-box { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
    .list { border: 1px solid #ccc; border-radius: 4px; height: 300px; overflow-y: auto; background: #fafafa; }
    .list-item { padding: 0.5rem; border-bottom: 1px solid #eee; cursor: pointer; font-size: 0.9rem; }
    .list-item:hover { background: #f0f0f0; }
    .list-item.selected { background: var(--c-accent); color: white; }
    .tags { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.5rem; }
    .tag { background: var(--c-accent); color: white; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; display: flex; align-items: center; gap: 4px; }
    .tag span { cursor: pointer; font-weight: bold; }

    /* Loading */
    .loader { position: absolute; inset: 0; background: rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: center; z-index: 50; transition: opacity 0.3s; pointer-events: none; opacity: 0; }
    .loader.active { opacity: 1; pointer-events: all; }
  </style>
</head>
<body>

<div class="grid">
  <aside>
    <div class="scroll-y">
      <div>
        <h3>Geography</h3>
        <label>Mode
          <select id="geo-mode">
            <option value="world">World Countries</option>
            <option value="us">US States</option>
          </select>
        </label>
      </div>

      <div id="proj-group">
        <h3>Projection</h3>
        <label>Type
          <select id="proj-select"></select>
        </label>
        <div style="margin-top:0.5rem; font-size:0.8rem; color:#666; font-style:italic;">
          <span id="proj-desc">Drag to rotate globe. Scroll to zoom.</span>
        </div>
      </div>

      <div>
        <h3>Style</h3>
        <label>Theme
          <select id="theme-select">
            <option value="planet">Planet Labs</option>
            <option value="light">Light Minimal</option>
            <option value="dark">Dark Cinematic</option>
            <option value="custom">Custom...</option>
          </select>
        </label>
        <div id="custom-colors" class="color-grid" style="display:none; margin-top:0.5rem;">
          <label>Ocean <input type="color" id="c-ocean"></label>
          <label>Land <input type="color" id="c-land"></label>
          <label>Borders <input type="color" id="c-stroke"></label>
          <label>Highlight <input type="color" id="c-high"></label>
          <label>Grid <input type="color" id="c-grid"></label>
          <label>Labels <input type="color" id="c-text"></label>
        </div>
      </div>

      <div>
        <h3>View</h3>
        <label>Zoom
          <div class="range-row">
            <input type="range" id="zoom-range" min="1" max="40" step="0.1" value="1">
            <span class="val-display" id="zoom-val">1.0</span>
          </div>
        </label>
        <button class="secondary" id="reset-view" style="margin-top:0.5rem;">Reset View</button>
      </div>

      <div>
        <h3>Labels</h3>
        <label class="range-row" style="margin-bottom:0.5rem;">
          <input type="checkbox" id="show-labels" checked style="width:auto; margin:0;"> Show Labels
        </label>
        <div id="label-opts">
          <label>Size
            <div class="range-row">
              <input type="range" id="label-size" min="6" max="32" value="10">
              <span class="val-display" id="label-size-val">10</span>
            </div>
          </label>
        </div>
      </div>
    </div>
  </aside>

  <main>
    <div id="loader" class="loader active">Loading Resources...</div>
    <svg id="map-svg"></svg>
  </main>

  <aside class="right">
    <div class="scroll-y">
      <div>
        <h3>Selection</h3>
        <div class="search-box">
          <input type="text" id="search" placeholder="Search...">
          <button id="clear-sel" class="secondary" style="width:auto;">Clear</button>
        </div>
        <div class="list" id="feature-list"></div>
        <div class="tags" id="sel-tags"></div>
      </div>

      <div style="margin-top:auto;">
        <h3>Export</h3>
        <label>Resolution
          <select id="export-res">
            <option value="web">Web (1200 × 630)</option>
            <option value="hd" selected>HD (1920 × 1080)</option>
            <option value="4k">4K (3840 × 2160)</option>
          </select>
        </label>
        <div style="display:flex; gap:0.5rem; margin-top:0.5rem;">
          <button id="dl-svg">Download SVG</button>
          <button id="dl-png">Download PNG</button>
        </div>
      </div>
    </div>
  </aside>
</div>

<script type="module">
import * as d3 from 'https://cdn.jsdelivr.net/npm/d3@7/+esm';
import * as topojson from 'https://cdn.jsdelivr.net/npm/topojson-client@3/+esm';
import versor from 'https://cdn.jsdelivr.net/npm/versor@0/+esm';
import { geoPolyhedralWaterman } from 'https://cdn.jsdelivr.net/npm/d3-geo-projection@4/+esm';

// --- State ---
const state = {
  mode: 'world', // world | us
  features: [],
  borders: null,
  selected: new Set(),
  projId: 'equalEarth',
  theme: 'planet',
  colors: {},
  transform: { k: 1, x: 0, y: 0 }, // For 2D
  rotation: [0, 0, 0], // For 3D [lambda, phi, gamma]
  width: 0,
  height: 0,
  zoom: 1,
  showLabels: true,
  labelSize: 10
};

// --- Config ---
const THEMES = {
  planet: { ocean:'#d2d2d2', land:'#ffffff', stroke:'#999999', high:'#009DA5', grid:'#e0e0e0', text:'#333333' },
  light:  { ocean:'#f0f4f8', land:'#ffffff', stroke:'#d1d5db', high:'#3b82f6', grid:'#e2e8f0', text:'#1e293b' },
  dark:   { ocean:'#111827', land:'#1f2937', stroke:'#374151', high:'#f59e0b', grid:'#374151', text:'#f3f4f6' },
  custom: { ocean:'#d2d2d2', land:'#ffffff', stroke:'#999999', high:'#009DA5', grid:'#e0e0e0', text:'#333333' }
};

const PROJECTIONS = {
  equalEarth: { name: 'Equal Earth', type: '2d', fn: d3.geoEqualEarth },
  mercator:   { name: 'Mercator', type: '2d', fn: d3.geoMercator },
  ortho:      { name: 'Globe (Orthographic)', type: '3d', fn: d3.geoOrthographic },
  waterman:   { name: 'Waterman Butterfly', type: '2d', fn: geoPolyhedralWaterman },
  albersUsa:  { name: 'Albers USA', type: 'fixed', fn: d3.geoAlbersUsa }
};

// --- Globals ---
let svg, gMap, pathSphere, pathGrid, gFeats, pathBorders, gLabels;
let projection, pathGen;
let zoomBehavior, dragBehavior;

// --- Init ---
async function init() {
  console.log("Initializing Map Engine...");
  
  // 1. Initialize Global SVG References
  svg = d3.select('#map-svg');
  if (svg.empty()) {
    console.error("Critical Error: SVG container not found.");
    return;
  }
  
  gMap = svg.append('g');
  pathSphere = gMap.append('path').attr('class', 'sphere');
  pathGrid = gMap.append('path').attr('class', 'grid').attr('fill', 'none');
  gFeats = gMap.append('g');
  pathBorders = gMap.append('path').attr('class', 'borders').attr('fill', 'none');
  gLabels = gMap.append('g').style('pointer-events', 'none');

  setupUI();
  updateTheme();
  
  // 2. Measure Container
  const resize = () => {
    const r = document.querySelector('main')?.getBoundingClientRect();
    if (r) {
      state.width = r.width;
      state.height = r.height;
      updateProjection();
    }
  };
  
  // 3. Load Data
  await loadData();
  
  // 4. Initial Render & Listener Attach
  resize(); // Trigger first sizing
  window.addEventListener('resize', resize);
  
  setLoading(false);
  console.log("Map Initialized.");
}

// --- Data ---
async function loadData() {
  setLoading(true);
  try {
    state.features = [];
    state.borders = null;

    if (state.mode === 'world') {
      const topo = await d3.json('./lib/assets/ne_50m_admin_0_countries_TOPOJSON_compact.json');
      state.features = topojson.feature(topo, topo.objects.ne_50m_admin_0_countries).features;
      state.borders = topojson.mesh(topo, topo.objects.ne_50m_admin_0_countries, (a, b) => a !== b);
    } else {
      const geo = await d3.json('./lib/assets/gz_2010_us_040_00_20m.json');
      state.features = geo.features;
    }
    
    state.features.sort((a,b) => getName(a).localeCompare(getName(b)));
    updateList();
  } catch (err) {
    console.error("Data Load Error:", err);
    alert("Error loading map data. Please check your ./lib/assets folder structure.");
  }
}

function getName(d) { return d.properties.NAME || d.properties.name || 'Unknown'; }

// --- Projection & Rendering ---
function updateProjection() {
  // CRITICAL: Safety check for svg
  if (!svg || svg.empty()) return;
  
  const def = PROJECTIONS[state.projId];
  if (!def) return;

  // Reset SVG Transform (important when switching 2D <-> 3D)
  if (def.type === '3d') {
    gMap.attr('transform', null);
  } else {
    gMap.attr('transform', `translate(${state.transform.x},${state.transform.y}) scale(${state.transform.k})`);
  }

  // Create Projection
  projection = def.fn();
  
  if (state.mode === 'us' && state.projId === 'albersUsa') {
    projection.fitSize([state.width, state.height], { type: 'FeatureCollection', features: state.features });
  } else if (def.type === '3d') {
    const fitRatio = Math.min(state.width, state.height) / 2.2; 
    projection.translate([state.width/2, state.height/2]);
    projection.scale(fitRatio * state.zoom);
    projection.rotate(state.rotation);
    projection.clipAngle(90);
  } else {
    projection.fitSize([state.width, state.height], { type: 'Sphere' });
  }

  pathGen = d3.geoPath(projection);
  
  updateInteractions(def.type);
  render();
}

function render() {
  if (!pathGen || !svg) return; // Defensive check

  const colors = state.colors;
  const is3D = PROJECTIONS[state.projId].type === '3d';
  
  // Background
  svg.style('background', is3D ? colors.ocean : '#e0e0e0');
  
  // Sphere
  const sphereD = pathGen({type:'Sphere'});
  if (sphereD) {
      pathSphere.attr('d', sphereD).attr('fill', colors.ocean).attr('stroke', 'none');
  }

  // Graticule
  const gridD = pathGen(d3.geoGraticule10());
  if (gridD) {
      pathGrid.attr('d', gridD).attr('stroke', colors.grid).attr('stroke-width', 0.5 / (is3D ? 1 : state.transform.k));
  }

  // Features
  gFeats.selectAll('path')
    .data(state.features, d => getName(d))
    .join('path')
    .attr('d', pathGen)
    .attr('fill', d => state.selected.has(getName(d)) ? colors.high : colors.land)
    .attr('stroke', colors.stroke)
    .attr('stroke-width', 0.5 / (is3D ? 1 : state.transform.k))
    .on('click', (e, d) => toggleSelect(getName(d)));

  // Borders
  if (state.borders) {
    const borderD = pathGen(state.borders);
    if(borderD) {
        pathBorders.attr('d', borderD)
          .attr('stroke', colors.stroke)
          .attr('stroke-width', 0.5 / (is3D ? 1 : state.transform.k));
    }
  } else {
    pathBorders.attr('d', null);
  }

  // Labels
  if (state.showLabels) {
    const visible = state.features.filter(d => state.selected.has(getName(d)));
    gLabels.selectAll('text')
      .data(visible, d => getName(d))
      .join('text')
      .attr('transform', d => {
        const c = pathGen.centroid(d);
        if (is3D && !d3.geoContains(d, projection.invert(c))) return 'translate(-9999,-9999)';
        return isFinite(c[0]) ? `translate(${c[0]},${c[1]})` : 'translate(-9999,-9999)';
      })
      .attr('text-anchor', 'middle')
      .attr('dy', '0.35em')
      .text(getName(d))
      .attr('fill', colors.text)
      .attr('font-size', state.labelSize / (is3D ? 1 : state.transform.k))
      .style('text-shadow', '0px 0px 3px rgba(255,255,255,0.8)');
  } else {
    gLabels.selectAll('text').remove();
  }
}

// --- Interactions ---
function updateInteractions(type) {
  // CRITICAL FIX: Ensure svg exists before attaching listeners
  if (!svg || svg.empty()) return;

  svg.on('.zoom', null).on('.drag', null);

  if (type === '3d') {
    // Globe Mode: Drag rotates, Wheel scales
    zoomBehavior = d3.zoom()
      .scaleExtent([0.5, 10])
      .on('zoom', e => {
        state.zoom = e.transform.k;
        document.getElementById('zoom-range').value = state.zoom;
        document.getElementById('zoom-val').textContent = state.zoom.toFixed(1);
        updateProjection(); 
      });
    
    svg.call(zoomBehavior).on("mousedown.zoom", null);
    svg.call(zoomBehavior.transform, d3.zoomIdentity.scale(state.zoom));

    dragBehavior = d3.drag()
      .on('start', dragStart)
      .on('drag', dragMove);
    
    svg.call(dragBehavior);

  } else {
    // 2D Mode: Standard Zoom/Pan
    zoomBehavior = d3.zoom()
      .scaleExtent([1, 40])
      .on('zoom', e => {
        state.transform = e.transform;
        state.zoom = e.transform.k; 
        document.getElementById('zoom-range').value = state.zoom;
        document.getElementById('zoom-val').textContent = state.zoom.toFixed(1);
        render(); // Efficient render
        gMap.attr('transform', e.transform);
      });
      
    svg.call(zoomBehavior);
    svg.call(zoomBehavior.transform, d3.zoomIdentity.translate(state.transform.x, state.transform.y).scale(state.transform.k));
  }
}

// Versor Drag Logic
let v0, q0, r0;
function dragStart(event) {
  const p = d3.pointer(event, this);
  v0 = versor.cartesian(projection.invert(p));
  r0 = projection.rotate();
  q0 = versor.rotation(r0);
  svg.style('cursor', 'grabbing');
}
function dragMove(event) {
  const p = d3.pointer(event, this);
  const v1 = versor.cartesian(projection.rotate(r0).invert(p));
  if (!v1) return;
  const q1 = versor.multiply(q0, versor.delta(v0, v1));
  state.rotation = versor.rotation(q1);
  updateProjection();
}

// --- UI Logic ---
function setupUI() {
  const projSel = document.getElementById('proj-select');
  const updateProjs = () => {
    projSel.innerHTML = Object.entries(PROJECTIONS)
      .filter(([k,v]) => {
        if(state.mode === 'us') return k === 'albersUsa';
        return k !== 'albersUsa';
      })
      .map(([k,v]) => `<option value="${k}">${v.name}</option>`).join('');
    
    if(state.mode === 'us') state.projId = 'albersUsa';
    else if(state.projId === 'albersUsa') state.projId = 'equalEarth';
    projSel.value = state.projId;
  };
  updateProjs();

  document.getElementById('geo-mode').addEventListener('change', e => {
    state.mode = e.target.value;
    state.selected.clear();
    state.rotation = [0,0,0]; 
    state.transform = {k:1, x:0, y:0};
    updateProjs();
    loadData().then(updateProjection); // Ensure data is loaded before projecting
  });

  document.getElementById('proj-select').addEventListener('change', e => {
    state.projId = e.target.value;
    const is3d = PROJECTIONS[state.projId].type === '3d';
    document.getElementById('proj-desc').textContent = is3d ? "Drag to rotate. Scroll to zoom." : "Drag to pan. Scroll to zoom.";
    updateProjection();
  });

  document.getElementById('zoom-range').addEventListener('input', e => {
    const k = +e.target.value;
    state.zoom = k;
    document.getElementById('zoom-val').textContent = k.toFixed(1);
    
    if (PROJECTIONS[state.projId].type === '3d') {
      updateProjection();
    } else {
      svg.call(zoomBehavior.scaleTo, k);
    }
  });

  document.getElementById('reset-view').addEventListener('click', () => {
    state.rotation = [0,0,0];
    state.zoom = 1;
    state.transform = {k:1,x:0,y:0};
    document.getElementById('zoom-range').value = 1;
    updateProjection();
  });

  document.getElementById('theme-select').addEventListener('change', e => {
    state.theme = e.target.value;
    const isCustom = state.theme === 'custom';
    document.getElementById('custom-colors').style.display = isCustom ? 'grid' : 'none';
    if(!isCustom) updateTheme();
    render();
  });

  ['ocean','land','stroke','high','grid','text'].forEach(k => {
    document.getElementById(`c-${k}`).addEventListener('input', e => {
      document.getElementById('theme-select').value = 'custom';
      state.theme = 'custom';
      state.colors[k] = e.target.value;
      render();
    });
  });

  document.getElementById('search').addEventListener('input', e => updateList(e.target.value));
  document.getElementById('clear-sel').addEventListener('click', () => { state.selected.clear(); updateList(); render(); });
  
  document.getElementById('show-labels').addEventListener('change', e => { state.showLabels = e.target.checked; render(); });
  document.getElementById('label-size').addEventListener('input', e => { 
    state.labelSize = +e.target.value; 
    document.getElementById('label-size-val').textContent = state.labelSize;
    render(); 
  });
  
  document.getElementById('dl-svg').addEventListener('click', () => exportMap('svg'));
  document.getElementById('dl-png').addEventListener('click', () => exportMap('png'));
  
  // Fix cursor behavior
  if(svg) svg.on('mouseup', () => svg.style('cursor', 'grab'));
}

function updateTheme() {
  state.colors = { ...THEMES[state.theme] };
  Object.keys(state.colors).forEach(k => {
    const el = document.getElementById(`c-${k}`);
    if(el) el.value = state.colors[k];
  });
}

function updateList(filter = '') {
  const list = document.getElementById('feature-list');
  const items = state.features.filter(d => getName(d).toLowerCase().includes(filter.toLowerCase()));
  
  list.innerHTML = items.map(d => {
    const name = getName(d);
    return `<div class="list-item ${state.selected.has(name) ? 'selected' : ''}" data-name="${name}">${name}</div>`;
  }).join('');
  
  const tags = document.getElementById('sel-tags');
  tags.innerHTML = Array.from(state.selected).map(name => 
    `<div class="tag">${name} <span data-name="${name}">×</span></div>`
  ).join('');
  
  list.querySelectorAll('.list-item').forEach(el => el.addEventListener('click', () => toggleSelect(el.dataset.name)));
  tags.querySelectorAll('span').forEach(el => el.addEventListener('click', () => toggleSelect(el.dataset.name)));
}

function toggleSelect(name) {
  if (state.selected.has(name)) state.selected.delete(name);
  else state.selected.add(name);
  updateList(document.getElementById('search').value);
  render();
}

function setLoading(active) {
  const l = document.getElementById('loader');
  if(active) l.classList.add('active');
  else l.classList.remove('active');
}

// --- Export ---
function exportMap(type) {
  const res = document.getElementById('export-res').value;
  const dims = { web:[1200,630], hd:[1920,1080], '4k':[3840,2160] }[res];
  const w = dims[0], h = dims[1];

  const exSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  exSvg.setAttribute("width", w);
  exSvg.setAttribute("height", h);
  exSvg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  
  let exProj = PROJECTIONS[state.projId].fn();
  if (state.mode === 'us') {
    exProj.fitSize([w, h], { type: 'FeatureCollection', features: state.features });
  } else if (PROJECTIONS[state.projId].type === '3d') {
     const fitRatio = Math.min(w, h) / 2.2;
     exProj.translate([w/2, h/2]).scale(fitRatio * state.zoom).rotate(state.rotation).clipAngle(90);
  } else {
     exProj.fitSize([w, h], { type:'Sphere' });
  }
  const exPath = d3.geoPath(exProj);
  const colors = state.colors;

  const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  rect.setAttribute("width", w); rect.setAttribute("height", h);
  rect.setAttribute("fill", colors.ocean);
  exSvg.appendChild(rect);

  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  exSvg.appendChild(g);
  
  if (PROJECTIONS[state.projId].type === '3d') {
    const sph = document.createElementNS("http://www.w3.org/2000/svg", "path");
    sph.setAttribute("d", exPath({type:'Sphere'}));
    sph.setAttribute("fill", colors.ocean);
    g.appendChild(sph);
  }

  const gr = document.createElementNS("http://www.w3.org/2000/svg", "path");
  gr.setAttribute("d", exPath(d3.geoGraticule10()));
  gr.setAttribute("fill", "none");
  gr.setAttribute("stroke", colors.grid);
  gr.setAttribute("stroke-width", w > 2000 ? 2 : 1);
  g.appendChild(gr);

  state.features.forEach(d => {
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    const pathStr = exPath(d);
    if (!pathStr) return;
    p.setAttribute("d", pathStr);
    p.setAttribute("fill", state.selected.has(getName(d)) ? colors.high : colors.land);
    p.setAttribute("stroke", colors.stroke);
    p.setAttribute("stroke-width", w > 2000 ? 2 : 1);
    g.appendChild(p);
  });

  if (state.showLabels) {
    state.features.filter(d => state.selected.has(getName(d))).forEach(d => {
      const c = exPath.centroid(d);
      if (PROJECTIONS[state.projId].type === '3d' && !d3.geoContains(d, exProj.invert(c))) return;
      
      const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
      txt.setAttribute("x", c[0]); txt.setAttribute("y", c[1]);
      txt.setAttribute("text-anchor", "middle");
      txt.setAttribute("fill", colors.text);
      txt.textContent = getName(d);
      txt.setAttribute("font-size", w > 2000 ? "32px" : "16px");
      txt.setAttribute("font-family", "sans-serif");
      g.appendChild(txt);
    });
  }

  const serializer = new XMLSerializer();
  const svgStr = serializer.serializeToString(exSvg);
  const blob = new Blob([svgStr], {type: "image/svg+xml;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  
  if (type === 'svg') {
    const a = document.createElement('a');
    a.href = url; a.download = `map-${state.mode}.svg`;
    a.click();
  } else {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const a = document.createElement('a');
      a.href = canvas.toDataURL("image/png");
      a.download = `map-${state.mode}.png`;
      a.click();
    };
    img.src = url;
  }
}

// Boot
init();
</script>
</body>
</html>
